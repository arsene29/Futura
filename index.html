<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0a0a0a">
<title>Futura</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--c1:#5df0ff;--c2:#b9a3ff;--y:#c8ff5d;--r:#ff3f8e;--ink:#eaf6ff;--mut:#a9c2f0;--bd:rgba(160,240,255,.45);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--ink);font:600 18px/1.25 Rajdhani,sans-serif;letter-spacing:.2px;background:radial-gradient(130% 60% at 50% 0,#2260f0 0,#0b2090 42%,#050a30 85%) fixed;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0b2486;z-index:60}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(#5df0ff14 1px,transparent 1px),linear-gradient(90deg,#5df0ff14 1px,transparent 1px);background-size:36px 36px}
button,input,select{font:inherit;color:inherit}option{color:#000}
button{border:1px solid #fffa;border-radius:999px;padding:10px 18px;min-height:44px;font:700 13px Orbitron,sans-serif;letter-spacing:1px;text-transform:uppercase;color:#052060;background:linear-gradient(#fff 0,#d6f7ff 48%,#7fe3ff 52%,#c8f4ff 100%);box-shadow:0 2px 10px #5df0ff55,inset 0 1px 0 #fff}
button:active{transform:scale(.94);filter:brightness(.9)}
button.pri{background:linear-gradient(#ffd0f0 0,#ff8ad8 48%,#e01fa8 52%,#ff7ad9 100%);color:#fff;text-shadow:0 1px 2px #70005a;box-shadow:0 2px 12px #ff4fd899,inset 0 1px 0 #fff}
button.gh{background:none;box-shadow:none;border:0;color:var(--c1);padding:6px 10px;min-height:36px}
.big{width:100%;margin-top:10px}
input,select{width:100%;background:#ffffff14;border:1px solid var(--bd);border-radius:12px;color:#fff;padding:12px;margin:6px 0;font:600 17px Rajdhani,sans-serif;min-height:46px}
input[type=range]{padding:0;accent-color:#5df0ff}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:10px;padding:8px 14px;background:#0b2486cc;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.sp{flex:1}
.chrome{font:900 21px Orbitron,sans-serif;letter-spacing:3px;background:linear-gradient(#fff,#8fe9ff 50%,#3a7bff 52%,#bfeaff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 6px #5df0ff99)}
.ic{width:44px;padding:0;font-size:20px;border-radius:50%}
.av{width:48px;height:48px;padding:3px;border-radius:50%;background:linear-gradient(135deg,#fff,#5df0ff,#b9a3ff);min-height:0}
.av img,.av b,.bigav img,.bigav b{display:grid;place-items:center;width:100%;height:100%;object-fit:cover;border-radius:50%;background:linear-gradient(135deg,#6a4dff,#2a9bff);color:#fff;font:800 20px Orbitron}
.pg{display:none}.pg.on{display:block;animation:pi .35s ease-out}@keyframes pi{from{opacity:0;transform:translateY(14px)}}
h1{font:800 18px Orbitron,sans-serif;letter-spacing:3px;margin:16px 16px 4px;text-shadow:0 0 14px #5df0ff}
.card{position:relative;background:linear-gradient(#ffffff22,#ffffff08);border:1px solid var(--bd);border-radius:20px;margin:12px 14px;padding:14px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 26px #0005,inset 0 1px 0 #ffffff77}
.em{color:var(--mut);font-size:17px;padding:6px 0}.row{display:flex;align-items:center;gap:8px}
.lab{display:inline-block;background:linear-gradient(#fff,#bff3ff);color:#052060;font:800 13px Orbitron,sans-serif;letter-spacing:1.5px;padding:5px 12px;border-radius:999px;box-shadow:0 0 10px #5df0ff66}
.hero{position:relative;height:235px;overflow:hidden}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,#0b2090)}
.hin{position:absolute;z-index:2;left:0;right:0;bottom:14px}
.cd{margin:0 14px;background:linear-gradient(135deg,#ffffff38,#5df0ff1c)}
.cd .t{font:800 12px Orbitron;letter-spacing:2px;color:var(--y)}.cd .n{font:700 19px Orbitron;margin:4px 0 10px;text-shadow:0 0 10px #5df0ff}
.clock{display:flex;gap:6px;align-items:flex-end}.u{background:#041046aa;border:1px solid var(--bd);border-radius:10px;padding:4px 8px;text-align:center;min-width:50px}
.u b{font:800 20px Orbitron;display:block;color:var(--c1);text-shadow:0 0 8px #5df0ff}.u i{font-style:normal;font:700 11px Orbitron;color:var(--mut)}
.mh{display:flex;justify-content:space-between;align-items:center;margin:2px 14px}#mt{font:800 15px Orbitron;letter-spacing:2px}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 5px;margin:10px 12px}
.w{text-align:center;font:700 12px Orbitron;color:var(--c1)}
.dc{aspect-ratio:1/1.1;position:relative;border-radius:12px;background:#ffffff14;border:1px solid #ffffff33;font:700 14px Orbitron;padding:5px 6px;box-shadow:inset 0 1px 0 #ffffff44}
.dc.td{background:linear-gradient(135deg,#ff6fd8,#6a4dff);border-color:#fff;box-shadow:0 0 14px #ff6fd8aa}
.dc.sel{border-color:var(--c1);background:#5df0ff33;box-shadow:0 0 14px #5df0ffaa}.dc.x{visibility:hidden}
.dots{position:absolute;bottom:5px;left:5px;right:5px;display:flex;gap:3px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c1);box-shadow:0 0 6px var(--c1)}.dot.k{border-radius:2px;background:var(--y);box-shadow:0 0 6px var(--y)}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff22}
.ev{width:12px;height:12px;background:var(--c1);box-shadow:0 0 8px var(--c1);border-radius:50%;flex:none}
.tk{width:30px;min-height:30px;height:30px;padding:0;border-radius:9px;background:#ffffff18;border:2px solid var(--y);display:grid;place-items:center;color:#052060;box-shadow:none}.tk.d{background:var(--y)}
.done{text-decoration:line-through;opacity:.5}
.bar{display:flex;align-items:center;justify-content:space-between;margin:10px 14px}#dt{font:800 15px Orbitron;letter-spacing:2px}
.board{background:linear-gradient(#eaf2ff,#c9dcff);padding:16px 10px 150px;color:#04164f;border-top:1px solid #fff;border-bottom:1px solid var(--bd);min-height:70vh}
.grid{position:relative;max-width:620px;margin:0 auto;background:#ffffffd9;border:1px solid #fff;border-radius:18px;box-shadow:0 12px 34px #1b4fd866;overflow:hidden;touch-action:pan-y}
.hr{height:56px;border-bottom:1px solid #c5d6ff;display:flex}
.hr .l{width:62px;flex:none;font:700 12px Orbitron;color:#cfeaff;background:linear-gradient(90deg,#0b2a9a,#1f5be0);padding:7px 6px;border-bottom:1px solid #ffffff22}
.snap{position:absolute;left:62px;right:0;height:56px;background:#5df0ff66;border:2px dashed #1b4fd8;border-radius:12px;display:none;z-index:2;pointer-events:none}
.blk{position:absolute;left:68px;right:6px;padding:6px 10px;color:#04164f;z-index:3;overflow:hidden;border-radius:14px;border:1px solid #fff;box-shadow:0 4px 12px #1b4fd877;touch-action:pan-y}
.blk::before{content:"";position:absolute;inset:0 0 50% 0;background:linear-gradient(#ffffffaa,#ffffff11);pointer-events:none}
.blk b{position:relative;display:block;font:800 12px Orbitron}.blk small{position:relative;font:700 13px Rajdhani}
.blk.dn{filter:grayscale(.85) brightness(.9)}.blk.dn b{text-decoration:line-through}
.hd{position:absolute;left:0;right:0;height:24px;z-index:4;touch-action:none}.hd.t{top:0}.hd.b{bottom:0}
.hd::after{content:"";position:absolute;left:50%;margin-left:-18px;width:36px;height:5px;border-radius:3px;background:#04164f99}.hd.t::after{top:3px}.hd.b::after{bottom:3px}
.fab{position:fixed;right:14px;bottom:calc(98px + env(safe-area-inset-bottom,0px));width:68px;height:68px;padding:0;border-radius:50%;z-index:25;font-size:28px;border:1px solid #fff;background:radial-gradient(circle at 35% 28%,#fff,#7fe9ff 35%,#2a6cff 78%);box-shadow:0 0 24px #5df0ff,inset 0 -6px 12px #0b2a9a}
.fab.pulse{animation:pl 1.2s infinite}@keyframes pl{50%{transform:scale(1.14);box-shadow:0 0 40px #5df0ff}}
.inv{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(#1240c8f2,#061456f8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bd);border-radius:26px 26px 0 0;padding:16px 14px calc(104px + env(safe-area-inset-bottom,0px));z-index:42;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1);max-height:68vh;overflow:auto}
.inv.open{transform:none}.inv.away{transform:translateY(105%)!important}
.inv>*{max-width:560px;margin-left:auto;margin-right:auto}
.slots{display:grid;grid-template-columns:repeat(var(--c,3),minmax(0,1fr));gap:10px;margin:12px auto 0;max-width:calc(var(--c,3)*130px)}
.slot{aspect-ratio:1;padding:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden;color:#04164f;text-transform:none;letter-spacing:0;border-radius:18px;border:1px solid #fff;background:linear-gradient(#ffffffaa,#fff0 55%),var(--bc);box-shadow:0 4px 12px #0006,inset 0 -6px 10px #0000002e;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;min-height:0}
.slot .ico{font-size:var(--ic,32px);line-height:1}
.slot .nm{font:700 var(--fs,14px)/1.05 Rajdhani,sans-serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%;word-break:break-word;text-align:center}
.slot small{font:700 12px Rajdhani;opacity:.75;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dense .slot small{display:none}
.slot.add{background:#ffffff10;border:2px dashed #ffffff66;color:#cfeaff;font:400 30px Orbitron;box-shadow:none}
.slot.hold{animation:sh .12s infinite}@keyframes sh{0%{transform:translate(-3px,1px) rotate(-4deg)}50%{transform:translate(3px,-1px) rotate(4deg)}100%{transform:translate(-3px,1px) rotate(-4deg)}}
.gb{position:fixed;z-index:99;width:100px;padding:8px;border-radius:14px;border:1px solid #fff;font:700 14px/1.1 Rajdhani;text-align:center;color:#04164f;background:linear-gradient(#ffffffaa,#fff0 55%),var(--bc);pointer-events:none;transform:translate(-50%,-70%) scale(1.1) rotate(-4deg);box-shadow:0 10px 26px #000a,0 0 20px var(--bc);display:none}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(92%,460px);z-index:45;display:flex;gap:4px;padding:6px;background:#06124acc;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:999px;box-shadow:0 8px 30px #000a,0 0 20px #5df0ff44}
nav button{flex:1;background:none;color:#cfeaff;border:0;box-shadow:none;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 4px}
nav button i{font-style:normal;font-size:16px;color:var(--c1)}
nav button.on{background:linear-gradient(#fff,#8fe9ff 50%,#3a9bff 52%,#bff3ff);color:#04164f;box-shadow:0 0 16px #5df0ff}nav button.on i{color:#04164f}
.sk{display:flex;gap:12px;align-items:center}
.lv{width:56px;height:56px;flex:none;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff,#7fe9ff 40%,#2a6cff);color:#04164f;font:900 20px Orbitron;box-shadow:0 0 16px #5df0ff88}
.xb{height:12px;background:#041046;border:1px solid var(--bd);border-radius:99px;overflow:hidden;margin-top:8px}.xb div{height:100%;border-radius:99px;transition:width .6s;box-shadow:0 0 10px currentColor}
.tag{display:inline-block;padding:3px 12px;border-radius:999px;font:800 12px Orbitron;color:#04164f}
.icons{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.ip{width:44px;padding:0;font-size:22px;border-radius:12px;background:#ffffff1c;box-shadow:none;border:1px solid #ffffff44}.ip.on{background:#5df0ff55;border-color:var(--c1);box-shadow:0 0 10px var(--c1)}
.mod{position:fixed;inset:0;background:#02062acc;z-index:70;display:none;align-items:flex-end}.mod.open{display:flex}
.mod>div{background:linear-gradient(#1240c8f5,#061456f8);width:100%;max-width:560px;margin:0 auto;padding:20px 16px calc(26px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;border-top:1px solid var(--bd);animation:pop .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{transform:translateY(70px);opacity:0}}
.ov{position:fixed;inset:0;z-index:55;background:radial-gradient(130% 60% at 50% 0,#2260f0 0,#0b2090 42%,#050a30 85%);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 0 50px;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.3,1);visibility:hidden}
.ov.on{transform:none;visibility:visible}
.bigav{width:120px;height:120px;padding:5px;margin:0 auto;border-radius:50%;background:linear-gradient(135deg,#fff,#5df0ff,#b9a3ff);min-height:0;box-shadow:0 0 24px #5df0ff}.bigav b{font-size:46px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-160px);background:#06124af2;color:#fff;font:700 13px Orbitron;padding:12px 20px;border:1px solid var(--c1);border-radius:999px;box-shadow:0 0 20px #5df0ff88;z-index:200;transition:transform .35s;white-space:nowrap}.toast.on{transform:translate(-50%,0)}
#lu{position:fixed;inset:0;z-index:250;display:none;place-items:center;text-align:center;background:radial-gradient(#2a6cff,#050a30);overflow:hidden}#lu.on{display:grid}
.burst{position:absolute;inset:-60%;background:repeating-conic-gradient(#5df0ff40 0 6deg,transparent 6deg 12deg);animation:spin 8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.lt{position:relative;font:900 40px Orbitron;letter-spacing:3px;background:linear-gradient(#fff,#8fe9ff 50%,#3a7bff 52%,#bfeaff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #5df0ff);animation:slam .55s cubic-bezier(.2,1.5,.4,1)}@keyframes slam{from{transform:scale(3);opacity:0}}
.ls{position:relative;display:inline-block;background:var(--y);color:#04164f;font:800 16px Orbitron;padding:8px 20px;border-radius:999px;margin-top:14px;box-shadow:0 0 20px var(--y)}
#wipe{position:fixed;inset:0;z-index:300;pointer-events:none}#wipe i{position:absolute;inset:0;clip-path:circle(0% at 50% 50%);opacity:0}
#wipe i:nth-child(1){background:radial-gradient(#fff,#5df0ff 40%,#2a6cff)}#wipe i:nth-child(2){background:#050a30}
#wipe.go i{animation:wp .65s ease-in-out}#wipe.go i:nth-child(2){animation-delay:.06s}
@keyframes wp{0%{clip-path:circle(0% at 50% 50%);opacity:1}45%,62%{clip-path:circle(150% at 50% 50%);opacity:1}100%{clip-path:circle(150% at 50% 50%);opacity:0}}
.it[data-ve],.it[data-vt]{cursor:pointer}.chev{color:var(--c1);font-size:26px;line-height:1}
.it.impit{background:linear-gradient(90deg,#ffd36b2a,transparent);border-left:3px solid #ffd36b;padding-left:9px}
.imps{display:inline-block;font:800 11px Orbitron;letter-spacing:1px;color:#3a2600;background:linear-gradient(#fff3b0,#ffc83d);padding:2px 8px;border-radius:99px;vertical-align:middle;box-shadow:0 0 8px #ffd36b}
.dc.imp{border-color:#ffd36b;box-shadow:0 0 12px #ffd36bbb}.st{position:absolute;top:2px;right:4px;font-size:11px;color:#ffd36b;animation:tw 1.4s infinite}@keyframes tw{50%{opacity:.4;transform:scale(1.3)}}
.cd.impcd{background:linear-gradient(135deg,#ffd36b55,#ff6fd833);border-color:#ffd36b;box-shadow:0 0 22px #ffd36b88}.cd.impcd .t{color:#fff3b0}
.imptog{background:#ffffff1c;color:#fff;box-shadow:none}.imptog.on{background:linear-gradient(#fff3b0,#ffc83d);color:#3a2600;box-shadow:0 0 16px #ffd36b}
.blk.lift{transform:scale(1.03);box-shadow:0 12px 30px #000a,0 0 20px #5df0ff;z-index:9}
.nowl{position:absolute;left:62px;right:0;height:2px;background:#ff3f8e;box-shadow:0 0 8px #ff3f8e;z-index:5;pointer-events:none}
.ip.sw{border:2px solid #fff8;border-radius:50%;box-shadow:none}.ip.sw.on{border-color:#fff;box-shadow:0 0 12px #fff}
#dt,#mt{cursor:pointer}
</style>


</head><body>
<header><div id="logo"></div><span class="sp"></span><button class="ic" id="bs" aria-label="Settings">⚙</button><button class="av" id="bp" aria-label="Profile"></button></header>
<section class="pg on" id="p-cal">
 <div class="hero"><div id="sk1"></div><div class="hin"><div class="card cd" id="cd"></div></div></div>
 <div class="mh"><button id="pm">◀</button><span id="mt"></span><button id="nm">▶</button></div>
 <div class="mg" id="mg"></div><div class="card" id="dl"></div>
</section>
<section class="pg" id="p-pl">
 <div class="bar"><button id="pd">◀</button><span id="dt"></span><button id="nd">▶</button></div>
 <div class="board"><div class="grid" id="grid"></div></div>
 <button class="fab" id="fab" aria-label="Chip case">💿</button>
 <div class="inv" id="inv"><div class="row"><span class="lab">CHIP CASE</span><span class="sp"></span><button class="gh" id="ic">Close</button></div>
 <div class="em">Tap a chip to edit it. Hold one for 1 second until it shakes, then drag it onto the schedule.</div><div class="slots" id="slots"></div></div>
</section>
<section class="pg" id="p-st"><h1 id="h-st"></h1><div id="rank" class="card"></div><div id="sks"></div><div style="margin:12px 14px"><button class="big pri" id="ask">+ NEW SKILL</button></div></section>
<nav id="tabs"></nav>
<div class="ov" id="ov"></div>
<div class="gb" id="gh"></div><div class="mod" id="mod"><div id="mb"></div></div>
<div class="toast" id="toast"></div><div id="lu"></div><div id="wipe"><i></i><i></i></div>
<script>
const $=s=>document.querySelector(s);
const PAL=['#5df0ff','#c8b2ff','#c8ff5d','#ff9be3','#ffd36b','#8fb2ff','#ff9a9a','#7dffcf'];
let S={events:[],tasks:[],skills:[{id:'s1',name:'Academics',xp:0,color:'#5ad1ff'},{id:'s2',name:'Fitness',xp:0,color:'#9be564'},{id:'s3',name:'Creativity',xp:0,color:'#b08cff'}],boxes:[],blocks:{},skipped:[],recur:[],log:[],cfg:{}};
try{const r=localStorage.getItem('questlog');if(r)Object.assign(S,JSON.parse(r))}catch(e){}
S.cfg=Object.assign({sfx:true,hap:true,mvol:.5,mon:true,name:'Phantom',track:'',pic:''},S.cfg);
const save=()=>{try{localStorage.setItem('questlog',JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const fh=h=>{h=h%24;const m=h%1?':30':'';h=Math.floor(h);return (h%12||12)+m+(h<12?' AM':' PM')};
const buzz=n=>{try{S.cfg.hap&&navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
const DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const rn=s=>esc(s);
/* sound */
let AC;function sfx(n){if(!S.cfg.sfx)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
 const T={tap:[[1200,.03,'sine',,.08]],tick:[[1800,.025,'triangle',,.1]],ok:[[520,.06],[780,.1]],open:[[400,.14,'sine',900],[900,.08]],close:[[800,.12,'sine',350]],
 swoosh:[[300,.22,'sawtooth',1400,.05],[1400,.05,'sine',,.08]],add:[[660,.06],[880,.06],[1320,.14]],trash:[[500,.18,'sawtooth',90,.07]],
 star:[[1047,.07],[1319,.07],[1568,.07],[2093,.24,'triangle']],err:[[220,.12,'square',,.07],[165,.2,'square',,.07]],
 hold:[[200,.1],[260,.1]],drop:[[340,.05],[170,.12]],done:[[392,.06],[523,.06],[659,.06],[784,.22]],lvl:[[523,.08],[659,.08],[784,.08],[1047,.08],[784,.08],[1047,.4,'triangle']]};
 let t=AC.currentTime;(T[n]||[]).forEach(([f,d,ty,to,v])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v||.16,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.85})}catch(e){}}

let drag=null,mv=null;document.addEventListener('touchmove',e=>{if((drag&&drag.on)||mv)e.preventDefault()},{passive:false});
function holdDrag(el,box){let timer,sx,sy,tapOK=false;
 el.onpointerdown=e=>{tapOK=true;sx=e.clientX;sy=e.clientY;const pid=e.pointerId;
  timer=setTimeout(()=>{tapOK=false;el.classList.add('hold');buzz([40,30,40]);sfx('hold');setTimeout(()=>{el.classList.remove('hold');drag={on:true,box};$('#inv').classList.add('away');
    const g=$('#gh');g.style.display='block';g.style.setProperty('--bc',box.color);g.innerHTML=(box.icon||'')+' '+esc(box.name);pos(sx,sy);try{el.setPointerCapture(pid)}catch(x){}
    drag.timer=setInterval(()=>{if(drag.y>innerHeight-130)scrollBy(0,14);else if(drag.y<150)scrollBy(0,-14);pos(drag.x,drag.y)},30)},250)},750)};
 el.onpointermove=e=>{if(!drag){if(Math.hypot(e.clientX-sx,e.clientY-sy)>12){clearTimeout(timer);tapOK=false}return}pos(e.clientX,e.clientY)};
 const end=()=>{clearTimeout(timer);el.classList.remove('hold');if(!drag){if(tapOK){tapOK=false;boxForm(box)}return}const d=drag;drag=null;clearInterval(d.timer);$('#gh').style.display='none';$('#snap').style.display='none';
  const r=$('#grid').getBoundingClientRect(),row=Math.floor((d.y-r.top)/H);$('#inv').classList.remove('open','away');
  if(d.y>r.top&&d.y<r.bottom&&row>=0&&row<NR){const s=H0+row;
   if(D().some(b=>b.start<s+1&&b.end>s))(sfx('err'),toast('That slot is taken'));
   else{D().push({id:uid(),name:d.box.name,bid:d.box.id,skill:d.box.skill,icon:d.box.icon,color:d.box.color,start:s,end:s+1,done:false});save();buzz(12);sfx('drop');drawGrid()}}else $('#inv').classList.add('open')};
 el.onpointerup=end;el.onpointercancel=()=>{if(drag)end();else{clearTimeout(timer);tapOK=false}};el.oncontextmenu=e=>e.preventDefault()}
function pos(x,y){if(!drag)return;drag.x=x;drag.y=y;const g=$('#gh');g.style.left=x+'px';g.style.top=y+'px';const r=$('#grid').getBoundingClientRect(),row=Math.floor((y-r.top)/H),s=$('#snap');if(row!==drag.row){drag.row=row;if(row>=0&&row<NR&&y>r.top&&y<r.bottom)sfx('tick')}
 if(s&&y>r.top&&y<r.bottom&&row>=0&&row<NR){s.style.display='block';s.style.top=row*H+'px'}else if(s)s.style.display='none'}
/* stats */
function drawStats(){const tot=S.skills.reduce((a,s)=>a+lvl(s.xp).l,0),xp=S.skills.reduce((a,s)=>a+s.xp,0);
 $('#rank').innerHTML=`<div class="row"><div class="lv">${tot}</div><div><div style="font:700 15px Orbitron">TOTAL LEVEL</div><div class="em" style="padding:0">${xp} XP earned · tap your portrait for advice</div></div></div>`;
 $('#sks').innerHTML=S.skills.map(s=>{const L=lvl(s.xp);return`<div class="card sk"><div class="lv">${L.l}</div><div class="sp"><span class="lab">${esc(s.name)}</span><div class="xb"><div style="width:${L.cur/L.need*100}%;background:${s.color}"></div></div><div class="em" style="padding:4px 0 0;font-size:14px">${L.cur} / ${L.need} XP to Lv ${L.l+1}</div></div></div>`}).join('')}
$('#ask').onclick=()=>{modal('<span class="lab">NEW SKILL</span><input id="f1" placeholder="Skill name (e.g. Guitar)"><button class="big pri" id="ok">ADD SKILL</button>');$('#ok').onclick=()=>{const n=$('#f1').value.trim();if(!n)return;S.skills.push({id:uid(),name:n,xp:0,color:PAL[S.skills.length%8]});save();closeM();drawStats()}};
/* profile */
function radar(){const k=S.skills.map(s=>({n:s.name,l:lvl(s.xp).l})),n=k.length;if(n<3)return'';const M=Math.max(5,...k.map(x=>x.l)),cx=150,cy=125,R=88;
 const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*R*r,cy+Math.sin(a)*R*r]},ring=r=>k.map((_,i)=>pt(i,r).join(',')).join(' ');
 return `<svg viewBox="0 0 300 250" width="100%"><polygon points="${ring(1)}" fill="#07123f" stroke="#5df0ff" stroke-width="2"/><polygon points="${ring(.5)}" fill="none" stroke="#3a5bd0"/><polygon points="${k.map((x,i)=>pt(i,Math.max(.12,x.l/M)).join(',')).join(' ')}" fill="#5df0ff66" stroke="#fff" stroke-width="3"/>${k.map((x,i)=>{const p=pt(i,1.25);return `<text x="${p[0]}" y="${p[1]}" text-anchor="middle" font-family="Orbitron" font-size="10" fill="#bff9ff">${esc(x.n)} ${x.l}</text>`}).join('')}</svg>`}
function advice(){const A=[],wk=Date.now()-6048e5,ks=S.skills.map(s=>({n:esc(s.name),l:lvl(s.xp).l,xp:s.xp,rec:S.log.filter(g=>g.s===s.name&&g.t>wk).reduce((a,g)=>a+g.x,0)}));
 if(!ks.length)return['Add a skill first, Phantom. We can’t steal what we can’t track.'];
 if(!ks.some(k=>k.xp))return['Your stats are blank, Phantom. Finish a block in the planner and we’ll get moving.'];
 const s=[...ks].sort((a,b)=>b.xp-a.xp),hi=s[0],lo=s[s.length-1];
 if(hi.l-lo.l>=2)A.push(`Your ${hi.n} is soaring (Lv ${hi.l}), but ${lo.n} is stuck at Lv ${lo.l}. You should work on ${lo.n}. You’re falling behind!`);
 ks.filter(k=>k.xp>0&&!k.rec).forEach(k=>A.push(`No ${k.n} training in 7 days. That skill is getting rusty, Phantom.`));
 ks.filter(k=>!k.xp&&k!==lo).forEach(k=>A.push(`${k.n} hasn’t been touched. Time to steal some progress.`));
 const b=[...ks].sort((a,b)=>b.rec-a.rec)[0];if(b.rec)A.push(`Nice work on ${b.n} this week: +${b.rec} XP. Keep the momentum!`);
 if(!A.length)A.push(`Balanced and sharp, ${esc(S.cfg.name)}. The team is proud.`);return A}
function drawProf(){const tot=S.skills.reduce((a,s)=>a+lvl(s.xp).l,0),xp=S.skills.reduce((a,s)=>a+s.xp,0),R=['Wannabe','Rookie Thief','Phantom Thief','Ace Thief','Legend','Trickster'];
 $('#ovb').innerHTML=`<h1 id="ph"></h1><div class="card" style="text-align:center"><button class="bigav" id="pp" style="background:#fff">${S.cfg.pic?`<img src="${S.cfg.pic}" alt="">`:'<b>★</b>'}</button><input type="file" id="pf" accept="image/*" style="display:none"><div class="em">Tap the portrait to change it</div><input id="pn" value="${esc(S.cfg.name)}" maxlength="16" style="text-align:center;font:700 18px Orbitron"><div class="row" style="justify-content:center"><span class="lab">LV ${tot}</span><span class="lab" style="background:#fff">${R[Math.min(5,Math.floor(tot/6))]}</span></div><div class="em">${xp} XP · ${S.log.length} quests cleared</div></div><div class="card">${radar()||'<div class="em">Add 3 or more skills to unlock your stat star.</div>'}</div><div class="card"><span class="lab" style="background:var(--r);color:#fff">NAVI SAYS</span>${advice().map(a=>`<div class="it">${a}</div>`).join('')}</div>`;
 $('#ph').innerHTML=rn('Profile');$('#pp').onclick=()=>$('#pf').click();
 $('#pn').oninput=e=>{S.cfg.name=e.target.value.trim()||'Phantom';save()};
 $('#pf').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=200;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,200,200);S.cfg.pic=c.toDataURL('image/jpeg',.8);save();drawAv();drawProf();sfx('done')};im.src=URL.createObjectURL(f)}}
/* settings + music */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('mem',1);r.onupgradeneeded=()=>r.result.createObjectStore('m');r.onsuccess=()=>res(r.result);r.onerror=rej});
async function mget(){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('m').objectStore('m').get('t');q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch(e){}}

 $('#sh').innerHTML=rn('Settings');
 $('#t1').onclick=()=>{c.sfx=!c.sfx;save();drawSet();sfx('ok')};$('#t2').onclick=()=>{c.hap=!c.hap;save();drawSet();buzz(30)};

let noClick=0;

 el.onpointerdown=e=>{if(e.target.closest('.hd'))return;b=D().find(x=>x.id===el.dataset.id);if(!b)return;y0=e.clientY;s0=b.start;pid=e.pointerId;
